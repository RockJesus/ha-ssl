name: ACME Self Test

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --quiet aiohttp cryptography
      - name: Check intra-package imports
        run: python scripts/import_check.py
      - name: Run ACME issuance self test
        run: python scripts/selftest_acme.py
