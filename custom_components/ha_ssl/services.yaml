renew:
  name: 立即签发/续期
  description: 立刻执行一次 ACME dns-01 签发，成功后把证书写入配置目录。默认会复用仍健康、剩余天数大于阈值的证书，避免消耗签发额度。
  fields:
    force:
      name: 强制重新签发
      description: 设为 true 时忽略「证书仍健康」判断，强制向 CA 下单（会消耗 Let's Encrypt 限流额度）。
      default: false
      selector:
        boolean:

configure_https:
  name: 写入 HTTPS 配置并重启
  description: 把 ssl_certificate / ssl_key 写入 Home Assistant 的 HTTP 配置（新版写 .storage/http，旧版写 configuration.yaml），端口与 TLS 档位取自集成选项，随后重启以生效。
  fields:
    restart:
      name: 自动重启（已废弃）
      description: 仅为兼容旧调用保留，已不再生效：需要重启时一律发通知由你手动重启。
      default: true
      example: true
      selector:
        boolean:

probe:
  name: 测试 CA 连通性
  description: 从当前 Home Assistant 主机逐个探测候选 ACME 目录的可达性，返回耗时与错误。

promote_https:
  name: 固化 HTTPS 配置
  description: 确认刚写入的 HTTPS 配置为正式配置，取消 5 分钟自动回退（HA 2026.11+ 的 HTTP 配置存储在 .storage/http，新配置默认只是待确认状态）。

update_ddns:
  name: 立即更新动态域名
  description: 立刻查询公网 IPv4/IPv6 并按记录清单核对全部 A / AAAA / CNAME / TXT 记录，返回逐条结果、双栈状态与最近变更历史。

diagnose:
  name: 网络与证书诊断
  description: 检测本机 IPv4/IPv6 出网、公网地址、DNS 服务商 zone 定位与证书链/私钥匹配情况，返回结构化结果。

verify_cert:
  name: 校验证书文件
  description: 检查磁盘上的证书与私钥是否匹配、证书链是否完整、SAN 覆盖哪些域名、还有多少天到期。

backup_cert:
  name: 备份证书
  description: 把 fullchain.pem 与 privkey.pem 打包成 zip，换机或重装时可直接恢复，省一次 Let's Encrypt 签发。
  fields:
    path:
      name: 备份目录
      description: 留空则写到 /config/ha_ssl_backups
      example: /config/ha_ssl_backups
      selector:
        text:

restore_cert:
  name: 恢复证书
  description: 从 backup_cert 生成的 zip 恢复证书对；会先校验证书与私钥是否匹配，再覆盖到证书目录。
  fields:
    path:
      name: 备份文件
      description: 备份 zip 的绝对路径
      required: true
      example: /config/ha_ssl_backups/ha_ssl_backup_20260101010101.zip
      selector:
        text:

purge:
  name: 清理集成全部痕迹
  description: 危险操作。从 HTTP 配置里移除本集成的证书与私钥，并删除证书、ACME 账户密钥与备份；执行后重启即回到纯 HTTP。必须显式传 confirm true。
  fields:
    confirm:
      name: 确认执行
      description: 必须为 true，否则不会执行任何删除。
      required: true
      example: true
      selector:
        boolean:
    remove_backups:
      name: 同时删除备份
      description: 是否删除 /config/ha_ssl_backups 里由本集成生成的备份 zip。
      default: true
      selector:
        boolean:
    restart:
      name: 自动重启（已废弃）
      description: 仅为兼容旧调用保留，已不再生效：需要重启时一律发通知由你手动重启。
      default: false
      selector:
        boolean:
